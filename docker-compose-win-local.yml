name: test-laravel13-1

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    container_name: tl13-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - tl13

  nginx:
    image: nginx:1.27-alpine
    container_name: tl13-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /usr/share/zoneinfo/UTC:/etc/localtime:ro
    depends_on:
      - app
    networks:
      - tl13

  mysql:
    image: mysql:8.0
    container_name: tl13-mysql
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "${FORWARD_DB_PORT:-3315}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tl13

  redis:
    image: redis:7-alpine
    container_name: tl13-redis
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
    ports:
      - "${FORWARD_REDIS_PORT:-6382}:6379"
    volumes:
      - redis-data:/data
    networks:
      - tl13

  mailpit:
    image: axllent/mailpit:latest
    container_name: tl13-mailpit
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
    ports:
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"          # SMTP
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"     # Web UI
    networks:
      - tl13

networks:
  tl13:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
